<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="topRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="botWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="centerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background circle dark outline -->
  <circle cx="16" cy="16" r="15" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Top Red Dome -->
  <path d="M 2 16 A 14 14 0 0 1 30 16 Z" fill="url(#topRed)"/>
  <!-- Bottom White Dome -->
  <path d="M 2 16 A 14 14 0 0 0 30 16 Z" fill="url(#botWhite)"/>
  <!-- Center Dark Band -->
  <rect x="2" y="14.5" width="28" height="3" fill="#090d16"/>
  <!-- Outer Center Button -->
  <circle cx="16" cy="16" r="5" fill="#090d16"/>
  <!-- Inner White Button Ring -->
  <circle cx="16" cy="16" r="3.2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.6"/>
  <!-- Core Core Dot -->
  <circle cx="16" cy="16" r="1.5" fill="url(#centerGlow)"/>
</svg>
